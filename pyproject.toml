[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-decision-engine"
version = "0.1.0"
description = "Clean-sheet Fantasy Football Decision Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
