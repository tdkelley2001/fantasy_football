[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-decision-engine"
version = "0.1.0"
description = "Clean-sheet Fantasy Football Decision Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "espn-api>=1.0,<1.1",
    "python-dotenv>=1.1,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.35",
]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
